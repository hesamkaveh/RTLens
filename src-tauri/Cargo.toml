[package]
name = "rtlens"
version.workspace = true
description = "BiDi lens for terminal output"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rtlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtlens-core = { version = "0.1.0", path = "../crates/rtlens-core" }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-store = "2.4.4"
tauri-plugin-autostart = "2.5.1"
arboard = "3.6.1"
window-vibrancy = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "NSPasteboard", "NSWorkspace", "NSRunningApplication",
    "NSApplication", "NSResponder", "NSWindow", "NSGraphics",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSString", "NSArray", "NSData", "NSDictionary", "NSValue",
] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
enigo = "0.6.1"
