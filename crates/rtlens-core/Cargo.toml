[package]
name = "rtlens-core"
description = "BiDi-aware sanitizer and layout engine for terminal output"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex = "1"
once_cell = "1"
strip-ansi-escapes = "0.2"
unicode-bidi = "0.3"
unicode-width = "0.2"
unicode-normalization = "0.1"

[dev-dependencies]
insta = "1"
unicode-width = "0.2"

[[bin]]
name = "rtlens-dump"
path = "src/bin/rtlens-dump.rs"
