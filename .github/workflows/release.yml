name: Release

# Tag a commit `v0.1.0` and this bundles that commit and attaches the DMG to a
# GitHub Release. Run it by hand first (workflow_dispatch) if you want to check
# the bundle before a tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary needs both slices; the runner is arm64, so the
          # Intel target has to be installed explicitly.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Import macOS signing identity
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/rtlens-signing.p12"
          certificate_pem="$RUNNER_TEMP/rtlens-signing.pem"
          keychain_path="$RUNNER_TEMP/rtlens-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          openssl pkcs12 \
            -in "$certificate_path" \
            -legacy \
            -clcerts \
            -nokeys \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -out "$certificate_pem"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"

          # Local development certificates are self-signed. Trust via admin domain
          # with sudo so codesign accepts the identity without GUI auth dialogs.
          subject="$(openssl x509 -in "$certificate_pem" -noout -subject -nameopt RFC2253)"
          issuer="$(openssl x509 -in "$certificate_pem" -noout -issuer -nameopt RFC2253)"
          if [[ "${subject#subject=}" == "${issuer#issuer=}" ]]; then
            sudo security add-trusted-cert \
              -d \
              -r trustRoot \
              -p codeSign \
              "$certificate_pem"
          fi

          security default-keychain -s "$keychain_path"
          existing_keychains="$(security list-keychains -d user | tr -d '\"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain_path" $existing_keychains

      # Via the Tauri CLI, never bare `cargo build --release`: the CLI is what
      # tells tauri-build this is a production build, and without it every
      # window loads devUrl against a dev server that is not running.
      - run: pnpm tauri build --target universal-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Verify macOS signature
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 \
            target/universal-apple-darwin/release/bundle/macos/RTLens.app

      - name: Generate updater.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          URL="https://github.com/hesamkaveh/RTLens/releases/download/${GITHUB_REF_NAME}/RTLens_${VERSION}_universal.app.tar.gz"
          SIG=$(cat target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig)

          cat > updater.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Update to RTLens $GITHUB_REF_NAME",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIG",
                "url": "$URL"
              },
              "darwin-x86_64": {
                "signature": "$SIG",
                "url": "$URL"
              }
            }
          }
          EOF

      - name: Attach the DMG and updater to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "RTLens ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz \
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig \
            updater.json || \
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz \
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig \
            updater.json

      - name: Keep the bundle when there is no tag to release to
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: rtlens-macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/rtlens-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/rtlens-signing.p12" "$RUNNER_TEMP/rtlens-signing.pem"
