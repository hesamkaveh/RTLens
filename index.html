<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTLens</title>
  </head>
  <body>
    <div id="shell" data-tauri-drag-region="deep">
      <header id="hud-header" data-tauri-drag-region="true">
        <div id="hud-actions" data-tauri-drag-region="false">
          <button
            id="close"
            type="button"
            data-tauri-drag-region="false"
            aria-label="Close popup"
            title="بستن (Esc)"
          >
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <span class="actions-divider" aria-hidden="true"></span>
          <button
            id="copy-btn"
            type="button"
            data-tauri-drag-region="false"
            aria-label="Copy text"
            title="کپی متن (⌘C)"
          >
            <svg class="icon-copy" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span id="copy-label">کپی</span>
          </button>
        </div>

        <div
          id="drag-handle"
          data-tauri-drag-region="true"
          aria-hidden="true"
          title="Drag to move"
        ></div>

        <div class="hud-header-spacer" data-tauri-drag-region="true"></div>
      </header>

      <main id="doc" class="rtl-doc"></main>

      <div id="empty" hidden>
        <div id="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </div>
        <p id="empty-title">No selection detected</p>
        <p id="empty-hint">Select some text, then press the RTLens shortcut.</p>
        <button id="empty-action" type="button" data-tauri-drag-region="false" hidden>Grant Permission…</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
