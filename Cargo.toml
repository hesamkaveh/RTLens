[workspace]
resolver = "2"
members = ["crates/rtlens-core", "src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
authors = ["Hesam Kaveh"]
repository = "https://github.com/hesamkaveh/RTLens"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
